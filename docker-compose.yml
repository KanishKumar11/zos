version: '3.9'

services:
  mongo:
    image: mongo:7
    container_name: agency-mongo
    restart: unless-stopped
    volumes:
      - mongo-data:/data/db
    environment:
      MONGO_INITDB_DATABASE: agency
    # no ports exposed — only reachable by other services inside the stack

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: agency-api
    restart: unless-stopped
    ports:
      - '4000:4000'
    env_file:
      - apps/api/.env
    depends_on:
      - mongo

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: agency-web
    restart: unless-stopped
    ports:
      - '3000:3000'
    env_file:
      - apps/web/.env
    depends_on:
      - api

volumes:
  mongo-data:
